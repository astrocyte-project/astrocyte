# The node's service directory — an example. A real deployment points
# ASTROCYTE_PORTAL_CONFIG at its own five files, which can list everything it
# self-hosts, on whichever machines.
#
# A link (`href`) is what a person's browser opens, so it has to be a name that
# works from their machine: the front door's (`--profile proxy`), built here from
# HOMEPAGE_VAR_DOMAIN. A tile for something the proxy does not publish carries no
# link — it still shows the container's state.
#
# A widget `url` is different: Homepage fetches it itself, on the node, so those
# stay on loopback.
- Coach Core:
    - Home Assistant:
        href: https://ha.{{HOMEPAGE_VAR_DOMAIN}}
        description: Coach automation & telemetry hub
        icon: home-assistant
        server: my-docker
        container: astrocyte-coach-homeassistant-1
        widget:
          type: homeassistant
          url: http://127.0.0.1:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
    - Astrocyte API:
        description: aios API + HA MCP — loopback/tailnet only (ADR-014)
        icon: si-fastapi
        server: my-docker
        container: astrocyte-coach-api-1

- Observability:
    - Grafana:
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Dashboards — energy & system health
        icon: grafana
        server: my-docker
        container: astrocyte-coach-grafana-1
        widget:
          type: grafana
          url: http://127.0.0.1:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
    - VictoriaMetrics:
        description: Time-series database — loopback only; read it in Grafana
        icon: si-victoriametrics
        server: my-docker
        container: astrocyte-coach-victoriametrics-1

- Apps:
    - Nextcloud:
        description: Files (--profile apps) — not behind the proxy yet
        icon: nextcloud
        server: my-docker
        container: astrocyte-coach-nextcloud-1
