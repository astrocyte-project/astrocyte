# Coach Mosquitto (the MQTT spine, ADR-012).
#
# Production: create /mosquitto/data/passwd inside the container —
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd astrocyte
# then set allow_anonymous false below and restart. The runbook walks this.

listener 1883
persistence true
persistence_location /mosquitto/data/

# Dev/sim default. Production flips to false + password_file (runbook step).
allow_anonymous true
#password_file /mosquitto/data/passwd
