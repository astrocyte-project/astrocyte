# VictoriaMetrics scrape config (Prometheus-compatible). Every target but the
# router is loopback on the coach node (host networking, 127.0.0.1).
#
# NOTE: the scraper expands env-var refs from the RAW file before YAML parsing,
# so a percent-brace token is substituted even inside a comment, and an unset
# variable is a startup error. Exactly one such token is used below
# (COACH_ROUTER_ADDR); do not write the syntax anywhere else, including in
# comments and including as an example.
global:
  scrape_interval: 30s        # modest — limits SD write amplification
  scrape_timeout: 10s
  external_labels:
    node: coach

scrape_configs:
  # Home Assistant's built-in Prometheus exporter (`prometheus:` in
  # configuration.yaml). Carries every recorded entity — including the Victron
  # battery/solar/tank sensors — as metrics. Bearer-authenticated; the token
  # file is written from ASTROCYTE_HA_TOKEN at deploy time (git-ignored).
  - job_name: home-assistant
    metrics_path: /api/prometheus
    bearer_token_file: /etc/victoriametrics/ha_token
    static_configs:
      - targets: ["127.0.0.1:8123"]

  # Astrocyte API request metrics (prometheus-fastapi-instrumentator).
  - job_name: astrocyte-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  # Per-container CPU / memory / disk / network.
  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8081"]

  # Host: CPU, RAM, disk, filesystem, thermals (Pi SoC temp).
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # VictoriaMetrics self-monitoring.
  - job_name: victoriametrics
    static_configs:
      - targets: ["127.0.0.1:8428"]

  # coach-router — coach firewall (OPNsense). Per-VLAN / per-WAN interface counters plus
  # host health. Scraped over the trusted VLAN address, which is the only one
  # node_exporter binds; permitted by the HA_HOST -> (self):9100 rule. igb1 is the
  # metered cellular WAN, so its counters are what the data-usage queries key on.
  #
  # The ADDRESS is a deployment input, substituted from COACH_ROUTER_ADDR (set on
  # the vmagent service; "host:port"). The `host` LABEL is deliberately NOT — it
  # stays the canonical `coach-router` whatever the box is called locally, because
  # the WAN dashboard queries key on it. Renaming the label here to match a local
  # hostname is what makes a dashboard match nothing while still rendering.
  - job_name: coach-router
    scrape_interval: 30s
    static_configs:
      - targets: ["%{COACH_ROUTER_ADDR}"]
        labels:
          host: coach-router
          role: firewall
