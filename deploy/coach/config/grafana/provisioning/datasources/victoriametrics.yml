# VictoriaMetrics speaks the Prometheus query API, so Grafana treats it as a
# Prometheus datasource. Loopback (host networking).
apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://127.0.0.1:8428
    isDefault: true
    jsonData:
      timeInterval: 30s          # matches the scrape interval
      httpMethod: POST
    editable: false
