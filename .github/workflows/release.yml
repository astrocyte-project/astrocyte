name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build & push image, publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the VCS version resolves from the tag

      # arm64 images for the coach Pi (ADR-013); emulated via QEMU.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release notes come from the CHANGELOG section for this tag (prose summary
      # + Added/Fixed/… entries), not the raw commit list.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (p) exit; if ($0 ~ "^## \\[" ver "\\]") { p=1; next } }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for ${version}." >&2
            exit 1
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
