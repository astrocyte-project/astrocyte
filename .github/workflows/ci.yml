name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  python-test:
    name: Python tests & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write       # coverage-comment action stores data on a branch
      pull-requests: write  # ...and posts the coverage comment
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  rvc-vcan:
    name: RV-C bridge integration (vcan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Set up vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      # `services:` can't override the container command, and mosquitto 2.x's
      # default config refuses non-localhost connections — run it as a step.
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
      - name: Run vcan integration tests
        run: uv run pytest -m vcan --no-cov -v

  web-lint:
    name: Web lint, type check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: astrocyte:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # arm64 canary on main pushes: catches arch breakage before release
      # builds do. No `load:` — multi-arch images can't be loaded.
      - name: Build arm64 canary
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Audit Python dependencies
        run: uvx pip-audit
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: astrocyte:scan
          cache-from: type=gha
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astrocyte:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
