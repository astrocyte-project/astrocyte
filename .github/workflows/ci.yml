name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  python-test:
    name: Python tests & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write       # coverage-comment action stores data on a branch
      pull-requests: write  # ...and posts the coverage comment
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  rvc-vcan:
    name: RV-C bridge integration (vcan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Set up vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      # `services:` can't override the container command, and mosquitto 2.x's
      # default config refuses non-localhost connections — run it as a step.
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
      - name: Run vcan integration tests
        run: uv run pytest -m vcan --no-cov -v

  web-lint:
    name: Web lint, type check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: astrocyte:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # arm64 canary on main pushes: catches arch breakage before release
      # builds do. No `load:` — multi-arch images can't be loaded.
      - name: Build arm64 canary
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Front door (#91, ADR-015) ------------------------------------------
      - name: Build Caddy image
        uses: docker/build-push-action@v7
        with:
          context: docker/caddy
          push: false
          load: true
          tags: astrocyte-caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Front door static checks (DNS module, Caddyfile modes and refusals)
        run: deploy/coach/e2e/check_front_door_static.sh astrocyte-caddy:ci
      # Compose interpolates every service whatever profile is active, so a hard
      # ${VAR:?} guard on a variable one profile needs breaks all the others.
      # Only what the default profile has always required is set here.
      - name: Coach compose file is valid for every profile
        working-directory: deploy/coach
        env:
          POSTGRES_PASSWORD: ci-only
          ASTROCYTE_API_TOKEN: ci-only
          ASTROCYTE_HA_TOKEN: ci-only
        run: |
          for profile in "" local-llm apps sim observability portal proxy; do
            echo "profile: ${profile:-(default)}"
            docker compose ${profile:+--profile "$profile"} config --quiet
          done
          echo "profile: all of them"
          docker compose --profile local-llm --profile apps --profile sim \
            --profile observability --profile portal --profile proxy config --quiet
      # The final stage only copies the cross-compiled binary, so this needs no
      # emulation — it proves the arm64 base image and the cross-build exist.
      - name: Build Caddy arm64 canary
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: docker/caddy
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=caddy-arm64
          cache-to: type=gha,mode=max,scope=caddy-arm64

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Audit Python dependencies
        run: uvx pip-audit
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: astrocyte:scan
          cache-from: type=gha
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astrocyte:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build Caddy image for scanning
        uses: docker/build-push-action@v7
        with:
          context: docker/caddy
          push: false
          load: true
          tags: astrocyte-caddy:scan
          cache-from: type=gha,scope=caddy
      - name: Scan Caddy image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astrocyte-caddy:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
