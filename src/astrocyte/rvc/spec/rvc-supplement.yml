# Astrocyte-local supplement to the vendored RV-C decode table (ADR-012).
#
# Part of Astrocyte, licensed AGPL-3.0 (see LICENSE). This file is OURS — it is
# NOT part of the upstream Apache-2.0 `rvc-spec.yml`, which stays byte-identical
# to its vendored commit so it can be re-vendored cleanly. The loader merges
# this table on top of the vendored one (see `spec.py::RvcSpec.load_vendored`);
# on a key collision this file wins.
#
# Each DGN body accepts the same schema as the vendored table, plus one extra
# key the loader understands:
#
#   category: protocol | internal | data   (default: data)
#
#   - protocol : standard J1939 transport/management PGNs. Recognized so the
#                bridge stops logging them as UNKNOWN, but never published to
#                MQTT/HA (they carry no coach telemetry).
#   - internal : proprietary / module-internal traffic we recognize but do not
#                publish — module↔module node-sync chatter, inert config
#                broadcasts, identification strings, and vendor-proprietary
#                status frames not yet decoded into user telemetry. Suppressed
#                like `protocol`; promote an entry to `data` once it is decoded.
#   - data     : real telemetry; decoded, published, and HA-discovered.
#
# PDU1 note: the five entries below are keyed with the destination byte cleared
# (`0EC00`, not `0ECFF`). The decoder maps any PDU1 frame (PF < 0xF0) onto its
# destination-cleared PGN before lookup and records the real destination on
# `DecodedMessage.destination_address`. So one entry covers every destination.
#
# Provenance: the classification comes from the first real-bus captures on coach
# refcoach (2026-07-21); see issue #123.

---

API_VERSION: 0

# --- Bucket A: standard J1939 protocol layer (PDU1, destination-specific) -----

"0E800":
  name: ACKNOWLEDGMENT
  category: protocol

"0EA00":
  name: PGN_REQUEST
  category: protocol

"0EB00":
  name: TP_DT
  category: protocol

"0EC00":
  name: TP_CM
  category: protocol

"0EE00":
  name: ADDRESS_CLAIMED
  category: protocol

# --- Bucket B: Firefly module↔module node-sync (proprietary, PDU1) ------------
#
# High-volume proprietary chatter between Firefly modules, addressed to specific
# nodes (0x92, 0x8E, ...). In the 2026-07-21 walk-through capture these were the
# bulk of the UNKNOWN frames — 16F92 (12,716), 16392 (12,716), 16E92 (6,733),
# 16F8E (299), 16C92 (260). They carry no user-facing telemetry; recognizing
# them as `internal` stops the ~9 Hz stream from being logged as UNKNOWN or
# hammering MQTT/HA. Keyed by destination-cleared base PGN, so one entry covers
# every destination via the decoder's PDU1 fallback. See issue #123.

"16300":
  name: FIREFLY_NODE_SYNC_16300
  category: internal

"16C00":
  name: FIREFLY_NODE_SYNC_16C00
  category: internal

"16E00":
  name: FIREFLY_NODE_SYNC_16E00
  category: internal

"16F00":
  name: FIREFLY_NODE_SYNC_16F00
  category: internal

# --- Coach refcoach: DC_DIMMER_STATUS_1 is inert (issue #122) --------------------
#
# The 2026-07-23 on-bus session proved this coach's DC_DIMMER_STATUS_1 (1FFBB)
# broadcasts a FIXED per-instance colour-config pattern every ~133 s and never
# reflects live light state (master_brightness = 0xFF; R/G/B static across every
# sweep despite active toggling). It cannot source HA light state, so it is
# reclassified `internal` to keep 36 instances of static config out of MQTT/HA.
# HA lights are built from the DC_DIMMER_COMMAND_2 map instead (ADR-012).

"1FFBB":
  name: DC_DIMMER_STATUS_1
  category: internal

# --- Coach refcoach: remaining proprietary broadcasts (issue #123) ----------------
#
# The 2026-07-21 + 2026-07-23 captures left 14 UNKNOWN DGN kinds after buckets A/B
# above (~10% of frames). None are standard RV-C DGNs missing from the vendored
# table — every one is vendor-proprietary (J1939 Proprietary-B PGNs 0xFFxx, or
# manufacturer DGNs from specific nodes). We recognize them as `internal` so the
# bridge stops logging them as UNKNOWN and the clean-decode soak evidence for the
# TX-enable gate (ADR-014) is not drowned in noise. Names encode what the evidence
# supports and no more; unidentified nodes get a neutral PROP_* name keyed on the
# DGN. src 0x9B is the confirmed DC dimmer / lighting controller (it also sources
# DC_DIMMER_COMMAND_2, issue #122).

# Lighting controller (src 0x9B) per-channel status. byte0 is a channel index
# (71 seen, grouped in RGB-like triplets), byte7 an on/off bit that DID track
# physical toggles across captures — so this carries real per-channel light
# state. NOT promoted to `data` yet: its channel space does not line up with the
# DC_DIMMER_COMMAND_2 instance map (41-94) that HA lights are built from, so
# publishing it would create unmapped, conflicting entities. Promote to `data`
# after the RGB-fixture reconcile pass maps channels -> fixtures (issue #122).
"15FCE":
  name: DC_DIMMER_CHANNEL_STATUS
  category: internal

# Lighting controller (src 0x9B) proprietary status, addressed (PDU1) to nodes
# 0xDC and 0xFD — base-keyed so one entry covers both, like the node-sync block.
"1AA00":
  name: DC_DIMMER_PROP_1AA00
  category: internal

# Lighting controller (src 0x9B) identification broadcast — payload begins with
# ASCII "ID" (49 44 ...), a fixed product/ident string.
"1FACF":
  name: DC_DIMMER_IDENT
  category: internal

# Lighting controller (src 0x9B) low-rate proprietary status.
"1FBDA":
  name: DC_DIMMER_PROP_1FBDA
  category: internal

# J1939 Proprietary-B broadcasts (PGN 0xFFxx) — manufacturer-defined, no public
# decode. 0FF01 is emitted by many nodes; 0FF2C/0FF2D by node 0x96.
"0FF01":
  name: PROP_B_0FF01
  category: internal

"0FF2C":
  name: PROP_B_0FF2C
  category: internal

"0FF2D":
  name: PROP_B_0FF2D
  category: internal

# Proprietary status families from individual modules, keyed exact (PDU2). Node
# 0x24 emits 1FE80/1FE82/1FDFF; node 0x96 emits 1FE99; node 0xFD emits 1FACE (a
# two-part identification frame, 0xAA-filled). 1FEA3 (node 0xE1) looks like live
# analog telemetry — byte5 sweeps a wide range at ~1.4 Hz — and is the best
# candidate to promote to `data` once the node and scaling are identified.
"1FE80":
  name: PROP_STATUS_1FE80
  category: internal

"1FE82":
  name: PROP_STATUS_1FE82
  category: internal

# Promoted from `internal` to `data` 2026-07-27: this is the AquaHot module's
# heat-source status, and it is the ONLY place Engine Preheat is reported.
#
# Decoded by capturing the bus while each switch was toggled one at a time on
# coach 41crb (74,713 frames):
#
#   15:40:37 burner on   ->  byte1 10 -> 11
#   15:41:27 preheat ON  ->  byte3 00 -> 10
#   15:42:02 preheat OFF ->  byte3 10 -> 00
#   15:42:27 burner off  ->  byte1 11 -> 10
#   15:43:02 electric off->  byte1 10 -> 00
#
# Byte 1 is what makes byte 3 trustworthy rather than a guess: its two bits
# reproduce WATERHEATER_STATUS `operating modes` at every one of those
# transitions (bit 0 = combustion, bit 4 = electric, both set = "gas electric"),
# so the frame's layout is corroborated by an independently decoded DGN before
# any claim is made about the preheat bit.
#
# Engine Preheat circulates the AquaHot's coolant through the coach's diesel
# engine to warm it before a cold start; the appliance manual requires the
# burner ON as well. Nothing in WATERHEATER_STATUS carries it, which is why
# earlier decode passes could not find it.
#
# Bytes 2 and 4-6 are static at 00 and byte 7 static at 04 across every capture,
# so they are left undeclared rather than guessed at.
"1FE99":
  name: AQUAHOT_HEAT_SOURCE_STATUS
  category: data
  parameters:
    - byte: 0
      name: instance
      type: uint8
    - byte: 1
      bit: 0
      name: burner enabled
      type: bit1
      values:
        0: burner not enabled
        1: burner enabled
    - byte: 1
      bit: 4
      name: electric element enabled
      type: bit1
      values:
        0: electric element not enabled
        1: electric element enabled
    - byte: 3
      bit: 4
      name: engine preheat active
      type: bit1
      values:
        0: engine preheat off
        1: engine preheat active

"1FDFF":
  name: PROP_STATUS_1FDFF
  category: internal

"1FEA3":
  name: PROP_STATUS_1FEA3
  category: internal

"1FACE":
  name: PROP_IDENT_1FACE
  category: internal

# --- Bucket C: corrections to vendored decode tables --------------------------

# WATERHEATER_STATUS, overridden ONLY to fix one wrong value label. The vendored
# table gives `burner status` bit 01 the label "ac element is active", which is
# a different appliance component than the field name describes.
#
# The bus settles it. On coach 41crb, `burner status` went active on the SAME
# timestamp as `operating modes` -> combustion (15:58:07) and both cleared
# together 20 s later, and it stayed off through every electric-only period. It
# tracks the DIESEL BURNER firing, never the AC element.
#
# The mislabel is not cosmetic: read literally it invites building an
# "electric element is on" indicator out of a field that reports the burner —
# and no field anywhere reports the electric element's run state (see
# `ac element status` below, which is a FAULT field, not an activity one).
#
# The whole body is restated because the loader replaces a colliding DGN
# wholesale rather than merging parameter-by-parameter. It is otherwise a
# verbatim copy of the vendored 1FFF7 — diff it against `rvc-spec.yml` when
# re-vendoring, and keep this entry only while upstream still carries the wrong
# label.
"1FFF7":
  name: WATERHEATER_STATUS
  category: data
  parameters:
    - byte: 0
      name: instance
      type: uint8
    - byte: 1
      name: operating modes
      type: uint8
      values:
        0: off
        1: combustion
        2: electric
        3: gas electric
        4: automatic
        5: test combustion
        6: test electric
    - byte: 2-3
      name: set point temperature
      type: uint16
      unit: Deg C
    - byte: 4-5
      name: water temperature
      type: uint16
      unit: Deg C
    - byte: 6
      bit: 0-1
      name: thermostat status
      type: bit
      values:
        00: set point met
        01: set point not met
    - byte: 6
      bit: 2-3
      name: burner status
      type: bit
      values:
        00: off
        01: burner is active
    - byte: 6
      bit: 4-5
      name: ac element status
      type: bit
      values:
        00: no fault
        01: open neutral fault detected
    - byte: 6
      bit: 6-7
      name: high temperature limit switch status
      type: bit
      values:
        00: limit switch not tripped
        01: limit switch tripped
    - byte: 7
      bit: 0-1
      name: failure to ignite status
      type: bit
      values:
        00: no failure
        01: failed to ignite
    - byte: 7
      bit: 2-3
      name: ac power failure status
      type: bit
      values:
        00: ac power present
        01: ac power not present
    - byte: 7
      bit: 4-5
      name: dc power failure status
      type: bit
      values:
        00: dc power present
        01: dc power not present
