# Pre-commit hooks for Astrocyte. Install with `pre-commit install`.
# Run against everything with `pre-commit run --all-files`.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - fastapi
          - pydantic

  # Prettier for the web app, using the project's own install (run
  # `make install` / `npm ci` in web/ first). Avoids a fragile global install
  # and stays in lockstep with the web-lint CI job.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: web/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|css|html)$
